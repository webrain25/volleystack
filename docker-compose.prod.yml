version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED}
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-change-me-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=3000
    expose:
      - "3000"
    networks:
      - volleystack_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - volleystack_net

networks:
  volleystack_net:

volumes:
  caddy_data:
  caddy_config:
