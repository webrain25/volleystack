version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-volleystack}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - volleystack_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-volleystack}?schema=public
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-change-me-in-production}
    depends_on:
      - db
    networks:
      - volleystack_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - volleystack_net

networks:
  volleystack_net:

volumes:
  postgres_data_prod:
  caddy_data:
  caddy_config:
